# MediaMTX Configuration for OccuSafe - Occupational Safety Monitoring
# Optimized for On-Demand RTSP -> WebRTC (WHEP) streaming

logLevel: info
logDestinations: [stdout]

# RTSP Server
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554

# RTMP Server
rtmp: no

# HLS Server (fallback)
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

# WebRTC Server (Primary low latency browser player)
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no

# API Server for dynamic camera path registration
api: yes
apiAddress: :9997

# Dynamic Paths Template
paths:
  # Default path for all cameras - allows publishers and readers
  all_others:
    maxReaders: 50
  
  # Example camera paths with RTSP sources (add your actual cameras here)
  camera1:
    source: rtsp://admin:password@192.168.1.100:554/stream
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    maxReaders: 50
    
  camera2:
    source: rtsp://admin:password@192.168.1.101:554/stream
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    maxReaders: 50
    
  # For cameras that will be published from your application
  app_camera1:
    maxReaders: 50
    
  app_camera2:
    maxReaders: 50
