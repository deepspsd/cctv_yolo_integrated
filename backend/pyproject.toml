[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepspsd", email = "dp3189756@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "ultralytics>=8.4.147",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
]

[project.scripts]
backend = "backend:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
