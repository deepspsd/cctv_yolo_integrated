map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream occusafe_backend {
    server backend:5000;
    keepalive 16;
}

upstream occusafe_mediamtx_webrtc {
    server mediamtx:8889;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 25m;   # employee photo / face template uploads

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://occusafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://occusafe_backend;
        access_log off;
    }

    # API docs (remove these two blocks to hide Swagger in production)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://occusafe_backend;
        proxy_set_header Host $host;
    }

    # ---- Real-time WebSocket ----
    location /ws/ {
        proxy_pass http://occusafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- WebRTC WHEP signalling -> MediaMTX (media itself flows over UDP/TCP 8189) ----
    location /webrtc/ {
        proxy_pass http://occusafe_mediamtx_webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # ---- SPA static assets ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
